<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista zakupów</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f3f7;color:#203047;font-family:Segoe UI,Arial,sans-serif}
main{max-width:1440px;margin:auto;padding:32px 28px 48px}
h1{margin:0 0 6px;font-size:30px;letter-spacing:-.7px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 10px;font-size:15px;color:#596675}
.stats b{color:#203047;font-size:17px}
h2{margin:30px 0 12px;font-size:13px;letter-spacing:.8px;color:#596675;font-weight:700}
section:first-of-type h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px}
figure{--label:#e6f3e9;--accent:#21603b;margin:0;background:var(--label);border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #2030470c;transition:box-shadow .2s}
.photo{position:relative;display:block;cursor:pointer;aspect-ratio:1;overflow:hidden;background:white}
img,.missing{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:1;transition:opacity .2s,filter .2s}
.missing{display:grid;place-content:center;justify-items:center;gap:8px;background:repeating-linear-gradient(135deg,#f6f8fa 0 12px,#eef1f5 12px 24px);color:#8a96a3}
.missing em{font-style:normal;font-size:14px}
input[type=checkbox]{position:absolute;top:14px;right:14px;width:16px;height:16px;margin:0;accent-color:#52667a;cursor:pointer;outline:2px solid white;border-radius:3px;box-shadow:0 0 0 3px #687b8e,0 2px 7px #0004}
input:focus-visible{outline:5px solid #ffd84d;outline-offset:2px}
figure:has(input:checked){box-shadow:0 0 0 3px var(--accent),0 6px 22px #20304716}
figure:has(input:checked) img,figure:has(input:checked) .missing{opacity:.55;filter:grayscale(.6)}
figure:has(input:checked) figcaption{color:#7b8794}
figure:has(input:checked) figcaption strong{color:#7b8794}
figcaption{padding:17px 18px;line-height:1.55;font-size:16px;background:var(--label)}
figcaption span{font-weight:600}
strong{display:inline;color:var(--accent);font-weight:750;white-space:nowrap}
.photo-wrap{position:relative}
.origin{position:absolute;bottom:6px;left:6px;z-index:2;font-size:14px}
.origin button{font:inherit;display:flex;align-items:flex-end;justify-content:flex-start;min-width:44px;min-height:44px;padding:4px;background:transparent;border:0;border-radius:6px;cursor:pointer;list-style:none}
.origin button span{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:21px;padding:3px 6px;background:rgba(255,255,255,.66);color:#4b514e;border-radius:4px;font-size:12px;line-height:1.2;font-weight:500}
.origin button:hover span,.origin.open button span{background:rgba(255,255,255,.9);color:#263d30}
.origin button:focus-visible{outline:3px solid #ffd84d;outline-offset:2px}
.origin-info{display:none}
.origin:hover .origin-info,.origin:has(button:focus-visible) .origin-info,.origin.open .origin-info{display:block}
.origin-info{position:absolute;pointer-events:none;left:0;bottom:50px;width:max-content;max-width:calc((100vw - 66px)/3);background:white;color:#203047;border-radius:8px;padding:10px;box-shadow:0 3px 16px #0003;line-height:1.4;overflow-wrap:anywhere}
.origin-info small{display:block;margin-top:4px;font-size:12px;color:#596675}
@media(max-width:700px){main{padding:20px 10px}figure{border-radius:10px}figcaption{padding:10px 8px;font-size:14px;overflow-wrap:anywhere}input[type=checkbox]{width:14px;height:14px;top:12px;right:12px}.missing svg{width:26px;height:26px}.missing em{font-size:11px}}
@media print{@page{size:A4;margin:10mm}body{background:white;print-color-adjust:exact;-webkit-print-color-adjust:exact}main{padding:0}h1{font-size:20px}figure{break-inside:avoid;box-shadow:none;border-radius:8px}figcaption{font-size:10px;padding:6px 8px}input[type=checkbox]{width:9px;height:9px;top:8px;right:8px}}
</style>
</head>

<script>
function licz() {
 const all = document.querySelectorAll('.photo input');
 const done = [...all].filter(function(i){ return i.checked; }).length;
 document.getElementById('todo').textContent = all.length - done;
 document.getElementById('done').textContent = done;
}
document.addEventListener('change', licz); licz();
document.addEventListener('click', function(event) {
 var btn = event.target.closest('.origin button');
 if (btn) btn.parentNode.classList.toggle('open');
 document.querySelectorAll('.origin.open').forEach(function(item) {
  if (!item.contains(event.target)) item.classList.remove('open');
 });
});
document.addEventListener('keydown', function(event) {
 if (event.key === 'Escape') document.querySelectorAll('.origin.open').forEach(function(item) {
  item.classList.remove('open'); item.querySelector('button').blur();
 });
});
</script>
