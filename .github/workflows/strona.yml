# =============================================================================
#  Budowanie i publikacja strony na GitHub Pages
# =============================================================================
#  Uruchamia się przy każdym wysłaniu zmian na gałąź `main` — i ręcznie,
#  przyciskiem „Run workflow” w zakładce Actions.
#
#  Skąd bierze się adres i klucz do bazy
#  -------------------------------------
#  Z sekretów repozytorium (Settings → Secrets and variables → Actions).
#  Nie z pliku `.env`, bo tego pliku w repozytorium nie ma i nie powinno być.
#
#  Uwaga na słowo „sekret”: klucz `anon` NIE jest tajny — po zbudowaniu i tak
#  siedzi w plikach strony, którą czyta każdy. Trzymamy go w sekretach tylko po
#  to, żeby nie wpisywać go na stałe w kodzie i żeby dało się go wymienić bez
#  zmiany kodu. Bazy pilnują reguły dostępu, nie tajność klucza.
# =============================================================================

name: Strona

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uprawnienia potrzebne akcji publikującej Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Gdy w trakcie budowania przyjdzie kolejna zmiana, dokańczamy tę nowszą.
# `cancel-in-progress: false` — publikacja przerwana w połowie zostawiłaby
# stronę w stanie niepełnym.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  budowanie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, nie 20 — i to nie jest kwestia gustu.
      #
      # `@supabase/supabase-js` tworzy klienta czasu rzeczywistego, a ten
      # potrzebuje wbudowanego WebSocketa. Node dostał go dopiero w wersji 22.
      # Na dwudziestce budowanie wywracało się w środku, komunikatem
      # „Node.js detected but native WebSocket not found”.
      #
      # Nie dało się tego zobaczyć na komputerze: tam Node jest nowszy, więc
      # budowanie przechodziło bez mrugnięcia. Wersję trzeba więc podać wprost,
      # a nie liczyć na to, co akurat stoi na maszynie.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      # Brak sekretu wychodził dotąd dopiero w środku budowania, jako
      # „supabaseUrl is required” ze stosu wywołań Metro — komunikat, po którym
      # nie widać, że chodzi o ustawienia repozytorium. Sprawdzamy więc na wejściu.
      - name: Sprawdzenie sekretów
        env:
          ADRES: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          KLUCZ: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          brak=0
          if [ -z "$ADRES" ]; then
            echo "BRAK sekretu EXPO_PUBLIC_SUPABASE_URL"; brak=1
          fi
          if [ -z "$KLUCZ" ]; then
            echo "BRAK sekretu EXPO_PUBLIC_SUPABASE_ANON_KEY"; brak=1
          fi
          if [ "$brak" = "1" ]; then
            echo
            echo "Dodaj je w: Settings -> Secrets and variables -> Actions,"
            echo "w sekcji Repository secrets (nie Environment secrets)."
            echo "Wartosci sa w pliku .env na Twoim komputerze."
            exit 1
          fi
          echo "Oba sekrety na miejscu."

      # Adres strony bierzemy z PRAWDZIWEJ nazwy repozytorium, zamiast wpisywać
      # go na stałe w app.json.
      #
      # GitHub serwuje projekt pod adresem zawierającym nazwę repozytorium,
      # z zachowaniem wielkości liter. Wpisana ręcznie wartość rozjechała się
      # z nią dwa razy — raz przez wielką literę, raz przy zmianie nazwy.
      # Skoro GitHub zna tę nazwę, niech ją sam poda.
      - name: Dopasowanie adresu do nazwy repozytorium
        env:
          REPOZYTORIUM: ${{ github.event.repository.name }}
        run: |
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            d.expo.experiments.baseUrl = '/' + process.env.REPOZYTORIUM;
            fs.writeFileSync('app.json', JSON.stringify(d, null, 2) + '\n');
            console.log('baseUrl =', d.expo.experiments.baseUrl);
          "

      - name: Sprawdzenie typów
        run: npx tsc --noEmit

      - name: Budowanie strony
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir dist

      # Expo tworzy katalog `_expo`. Jekyll — który GitHub historycznie
      # uruchamiał na stronach — pomija wszystko, co zaczyna się od podkreślenia,
      # więc strona ładowałaby się bez kodu. Pusty `.nojekyll` to wyłącza.
      - name: Wyłączenie Jekylla
        run: touch dist/.nojekyll

      # Adresy w expo-router obsługuje serwer. GitHub Pages serwera nie ma,
      # więc wejście wprost na /talerz/przepisy dałoby 404. Kopia strony
      # głównej pod nazwą 404.html sprawia, że GitHub oddaje aplikację,
      # a ta sama rozpoznaje adres.
      - name: Obsługa adresów bez serwera
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publikacja:
    needs: budowanie
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - id: wdrozenie
        uses: actions/deploy-pages@v4
