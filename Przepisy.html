<style>
.recipe-toolbar {
    --green: #2f6f2f;
    --green-dark: #193b25;
    --green-soft: #eef5e8;
    --text: #1f2b24;
    --muted: #687970;
    --border: #d6e0d3;

    width: 100%;
    box-sizing: border-box;

    padding: 28px 36px 30px;

    background: linear-gradient(90deg, #fbfcf9 0%, #ffffff 100%);
    border: 1px solid #e3e8e0;
    border-radius: 28px;

    font-family: Arial, sans-serif;
}


/* =========================
   GÓRNY WIERSZ
========================= */

.recipe-toolbar__header {
    display: flex;
    align-items: center;
    gap: 24px;
}

.recipe-toolbar__icon {
    width: 92px;
    height: 92px;
    flex: 0 0 92px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
    background: #eaf3df;
}

.recipe-toolbar__icon svg {
    width: 52px;
    height: 52px;

    fill: none;
    stroke: var(--green);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}


.recipe-toolbar__title-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
}

.recipe-toolbar__title {
    margin: 0;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 56px;
    line-height: 1;
    font-weight: 700;

    color: var(--green-dark);
}

.recipe-toolbar__count {
    padding: 10px 22px;

    border-radius: 999px;
    background: #eaf3df;

    color: #285c2c;
    font-size: 18px;
    font-weight: 700;
}


/* =========================
   PRAWA CZĘŚĆ
========================= */

.recipe-toolbar__content {
    flex: 1;
    min-width: 0;
}


/* =========================
   WYSZUKIWARKA
========================= */

.recipe-search {
    margin-top: 20px;

    width: 100%;
    min-height: 72px;

    display: flex;
    align-items: center;
    gap: 16px;

    padding: 0 24px;

    border: 1.5px solid #4e7755;
    border-radius: 20px;

    background: #fff;
}

.recipe-search svg {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;

    stroke: #74867b;
}

.recipe-search input {
    width: 100%;

    border: 0;
    outline: 0;

    background: transparent;

    color: var(--text);
    font-size: 20px;
}

.recipe-search input::placeholder {
    color: #8b9890;
}


/* =========================
   FILTRY
========================= */

.recipe-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;

    margin-top: 20px;
}

.recipe-filter {
    min-height: 50px;

    padding: 0 22px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--border);
    border-radius: 999px;

    background: #fbfcfa;

    color: #315d37;
    font-size: 17px;
    font-weight: 700;

    cursor: pointer;

    transition:
        background .15s ease,
        color .15s ease,
        border-color .15s ease;
}

.recipe-filter:hover {
    border-color: #7a9b7b;
}

.recipe-filter--active {
    color: #fff;

    border-color: #35763b;

    background: linear-gradient(
        180deg,
        #4f944b 0%,
        #2f762f 100%
    );
}


/* =========================
   UKŁAD
========================= */

.recipe-toolbar__main {
    display: grid;
    grid-template-columns: 92px 1fr;
    column-gap: 24px;
}

.recipe-toolbar__header {
    grid-column: 1 / 3;
}

.recipe-toolbar__search-area {
    grid-column: 2;
}


/* =========================
   RESPONSYWNOŚĆ
========================= */

@media (max-width: 720px) {

    .recipe-toolbar {
        padding: 20px;
        border-radius: 20px;
    }

    .recipe-toolbar__main {
        grid-template-columns: 64px 1fr;
        column-gap: 16px;
    }

    .recipe-toolbar__icon {
        width: 64px;
        height: 64px;
        flex-basis: 64px;
    }

    .recipe-toolbar__icon svg {
        width: 38px;
        height: 38px;
    }

    .recipe-toolbar__title {
        font-size: 40px;
    }

    .recipe-toolbar__count {
        padding: 7px 14px;
        font-size: 15px;
    }

    .recipe-search {
        min-height: 60px;
        padding: 0 18px;
    }

    .recipe-search input {
        font-size: 17px;
    }

    .recipe-filter {
        min-height: 44px;
        padding: 0 16px;
        font-size: 15px;
    }
}

@media (max-width: 520px) {

    .recipe-toolbar__main {
        display: block;
    }

    .recipe-toolbar__header {
        gap: 14px;
    }

    .recipe-toolbar__title {
        font-size: 36px;
    }

    .recipe-toolbar__search-area {
        width: 100%;
    }
}
</style>


<section class="recipe-toolbar">

    <div class="recipe-toolbar__main">

        <div class="recipe-toolbar__header">

            <!-- IKONA -->
            <div class="recipe-toolbar__icon">

                <svg viewBox="0 0 24 24">

                    <!-- książka -->
                    <path d="M3 5.5c3-1 6-.5 9 1.5v13c-3-2-6-2.5-9-1.5z"/>
                    <path d="M21 5.5c-3-1-6-.5-9 1.5v13c3-2 6-2.5 9-1.5z"/>

                    <!-- linie -->
                    <path d="M6 9h3"/>
                    <path d="M6 12h3"/>
                    <path d="M6 15h3"/>

                    <!-- czapka kucharska -->
                    <path d="
                        M15.5 10.5
                        c-.1-1 .6-1.8 1.5-1.9
                        .4-1 1.8-1.1 2.3-.2
                        .9-.1 1.6.6 1.6 1.5
                        0 .7-.4 1.2-1 1.5
                        v2.7h-3.8v-2.7
                        c-.4-.2-.6-.5-.6-.9z
                    "/>

                </svg>

            </div>


            <!-- TYTUŁ -->
            <div class="recipe-toolbar__title-row">

                <h1 class="recipe-toolbar__title">
                    Przepisy
                </h1>

                <div class="recipe-toolbar__count">
                    34 w bazie
                </div>

            </div>

        </div>


        <div class="recipe-toolbar__search-area">

            <!-- WYSZUKIWARKA -->
            <label class="recipe-search">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M20 20l-4-4"/>
                </svg>

                <input
                    type="search"
                    placeholder="Szukaj przepisu..."
                >

            </label>


            <!-- FILTRY -->
            <div class="recipe-filters">

                <button class="recipe-filter recipe-filter--active">
                    Wszystkie 34
                </button>

                <button class="recipe-filter">
                    Śniadania 8
                </button>

                <button class="recipe-filter">
                    Obiady 15
                </button>

                <button class="recipe-filter">
                    Kolacje 10
                </button>

                <button class="recipe-filter">
                    Dodatki 2
                </button>

            </div>

        </div>

    </div>

</section>
