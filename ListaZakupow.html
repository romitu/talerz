<style>
.shopping-summary {
    box-sizing: border-box;
    width: 100%;
    min-height: 170px;
    padding: 18px 26px;

    display: flex;
    align-items: center;
    gap: 28px;

    position: relative;
    overflow: hidden;

    background: #fffdf9;
    border: 1px solid #ebe7df;
    border-radius: 18px;
    box-shadow: 0 4px 16px rgba(55, 45, 30, 0.06);

    color: #173b15;
    font-family: Arial, sans-serif;
}


/* =====================================================
   IKONA KOSZYKA
   ===================================================== */

.shopping-summary__cart {
    width: 82px;
    height: 82px;
    flex: 0 0 82px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
    background: #f2f5e8;
}

.shopping-summary__cart svg {
    width: 43px;
    height: 43px;
    stroke: #28571f;
}


/* pionowa kreska */

.shopping-summary__divider {
    width: 1px;
    height: 82px;
    background: #e1e7d3;
}


/* =====================================================
   TYTUŁ + DATA
   ===================================================== */

.shopping-summary__main {
    min-width: 380px;
}

.shopping-summary__title {
    margin: 0 0 12px;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 42px;
    line-height: 1;
    font-weight: 700;

    color: #153a12;
}

.shopping-summary__date {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 17px;
    color: #345c2f;
}

.shopping-summary__date svg {
    width: 23px;
    height: 23px;
    flex: 0 0 23px;

    stroke: #7f9226;
}


/* =====================================================
   LICZNIKI
   ===================================================== */

.shopping-summary__stats {
    display: flex;
    align-items: center;
    gap: 16px;

    margin-left: auto;
    margin-right: 230px;
}

.shopping-stat {
    box-sizing: border-box;

    height: 72px;
    min-width: 260px;
    padding: 0 20px;

    display: flex;
    align-items: center;
    gap: 14px;

    border-radius: 14px;
}


/* zrealizowane */

.shopping-stat--done {
    background: linear-gradient(
        90deg,
        #f5f8ef 0%,
        #fbfcf8 100%
    );

    border: 1px solid #dce7cb;
    color: #38652f;
}


/* niezrealizowane */

.shopping-stat--todo {
    background: linear-gradient(
        90deg,
        #fffdfa 0%,
        #fff9f3 100%
    );

    border: 1px solid #f0d8bc;
    color: #984d08;
}


.shopping-stat__icon {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
}


/* zielone kółko */

.shopping-stat--done .shopping-stat__icon {
    background: #5b913f;
}

.shopping-stat--done .shopping-stat__icon svg {
    width: 23px;
    height: 23px;

    stroke: #fff;
    stroke-width: 3;
}


/* pomarańczowe kółko */

.shopping-stat--todo .shopping-stat__icon {
    box-sizing: border-box;

    border: 3px solid #e98216;
    background: #fff;
}


.shopping-stat__label {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
}

.shopping-stat__number {
    margin-left: auto;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
}


/* =====================================================
   TORBA PO PRAWEJ
   ===================================================== */

.shopping-summary__bag {
    position: absolute;

    right: 12px;
    bottom: -7px;

    width: 215px;
    height: 165px;

    pointer-events: none;
}

.shopping-summary__bag svg {
    width: 100%;
    height: 100%;
}


/* =====================================================
   RESPONSYWNOŚĆ
   ===================================================== */

@media (max-width: 1250px) {

    .shopping-summary {
        gap: 18px;
    }

    .shopping-summary__stats {
        margin-right: 175px;
    }

    .shopping-stat {
        min-width: 220px;
    }

    .shopping-summary__bag {
        width: 175px;
    }
}


@media (max-width: 1050px) {

    .shopping-summary__main {
        min-width: 300px;
    }

    .shopping-summary__title {
        font-size: 36px;
    }

    .shopping-summary__stats {
        margin-right: 0;
    }

    .shopping-summary__bag {
        opacity: 0.14;
    }
}


@media (max-width: 820px) {

    .shopping-summary {
        flex-wrap: wrap;
        min-height: auto;
    }

    .shopping-summary__divider {
        display: none;
    }

    .shopping-summary__main {
        min-width: 0;
        flex: 1;
    }

    .shopping-summary__stats {
        width: 100%;
    }

    .shopping-stat {
        flex: 1;
    }
}


@media (max-width: 600px) {

    .shopping-summary {
        padding: 16px;
    }

    .shopping-summary__cart {
        width: 60px;
        height: 60px;
        flex-basis: 60px;
    }

    .shopping-summary__cart svg {
        width: 32px;
        height: 32px;
    }

    .shopping-summary__title {
        font-size: 30px;
    }

    .shopping-summary__date {
        font-size: 14px;
    }

    .shopping-summary__stats {
        flex-direction: column;
    }

    .shopping-stat {
        width: 100%;
    }
}
</style>
