<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f2f5f1;
    font-family: Arial, Helvetica, sans-serif;
    color: #203028;
}

.page {
    padding: 14px;
}

.profile-card {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 22px;

    background: #fff;
    border: 1px solid #e3e8e2;
    border-radius: 22px;

    box-shadow: 0 4px 14px rgba(35, 60, 40, 0.04);
}


/* =====================================================
   GÓRNY WIERSZ
   ===================================================== */

.profile-top {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;

    margin-bottom: 22px;
}

.profile-title {
    margin: 0;

    font-size: 28px;
    line-height: 1;
    font-weight: 700;

    color: #1d2c23;
}

.profile-email {
    font-size: 14px;
    font-weight: 600;
    color: #67796e;
}

.profile-separator {
    width: 1px;
    height: 28px;
    background: #dfe5df;
}

.profile-role {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 7px 12px;

    background: #f2f6f2;
    border-radius: 20px;

    font-size: 14px;
}

.role-icon {
    width: 29px;
    height: 29px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #e4eee5;
    color: #4a7655;
}

.role-icon svg {
    width: 17px;
    height: 17px;

    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
}


/* =====================================================
   OSOBA
   ===================================================== */

.person-row {
    display: flex;
    align-items: center;

    gap: 14px;

    margin-bottom: 22px;
}

.person-avatar {
    width: 64px;
    height: 64px;

    flex: 0 0 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #e8ece8;
    color: #426d4d;
}

.person-avatar svg {
    width: 31px;
    height: 31px;
    fill: currentColor;
}

.person-name {
    margin: 0 0 4px;

    font-size: 30px;
    line-height: 1;

    font-weight: 500;
}

.person-meta {
    font-size: 15px;
    font-weight: 600;

    color: #68786f;
}


/* =====================================================
   MAKRO
   ===================================================== */

.profile-macros {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 14px;

    margin-bottom: 18px;
}

.macro-item {
    text-align: center;
}

.macro-icon {
    width: 48px;
    height: 48px;

    margin: 0 auto 7px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
}

.macro-icon svg {
    width: 24px;
    height: 24px;

    fill: none;
    stroke: currentColor;
    stroke-width: 2;
}

.macro-kcal {
    background: #e8efea;
    color: #426e50;
}

.macro-protein {
    background: #e8f3ed;
    color: #469261;
}

.macro-fat {
    background: #fff1df;
    color: #dc840c;
}

.macro-carbs {
    background: #e9f1fb;
    color: #3878cd;
}

.macro-value {
    display: block;

    font-size: 22px;
    font-weight: 700;
}

.macro-label {
    display: block;

    margin-top: 2px;

    font-size: 14px;
    font-weight: 600;

    color: #66776d;
}


/* =====================================================
   CEL
   ===================================================== */

.profile-goal {
    display: flex;
    align-items: center;

    gap: 9px;

    padding: 11px 14px;

    margin-bottom: 16px;

    border-radius: 11px;

    background: #dde9df;

    color: #447153;

    font-size: 14px;
    font-weight: 600;
}

.goal-check {
    width: 20px;
    height: 20px;

    flex: 0 0 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #477956;
    color: #fff;
}


/* =====================================================
   PRZYCISKI – WSZYSTKIE OBOK SIEBIE
   ===================================================== */

.profile-actions {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 10px;
}

.profile-button {
    min-height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    padding: 10px 14px;

    border-radius: 10px;

    font-family: inherit;
    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}

.profile-button svg {
    width: 19px;
    height: 19px;

    fill: none;
    stroke: currentColor;
    stroke-width: 2;
}

.profile-button--primary {
    border: 1px solid #41734f;

    background: #41734f;
    color: #fff;
}

.profile-button--outline {
    border: 1px solid #4c7c59;

    background: #fff;
    color: #447250;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 650px) {

    .profile-card {
        padding: 16px;
    }

    .profile-top {
        gap: 8px;
    }

    .profile-title {
        font-size: 24px;
    }

    .profile-separator {
        display: none;
    }

    .profile-macros {
        grid-template-columns: repeat(2, 1fr);
    }

    .profile-actions {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="page">

<section class="profile-card">

    <!-- GÓRNA LINIA -->

    <div class="profile-top">

        <h1 class="profile-title">
            Profil
        </h1>

        <div class="profile-email">
            romitu@gmail.com
        </div>

        <div class="profile-separator"></div>

        <div class="profile-role">

            <div class="role-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/>
                    <path d="M8.5 12l2.2 2.2L15.5 9"/>
                </svg>
            </div>

            <span>
                <strong>Rola:</strong> administrator
            </span>

        </div>

    </div>


    <!-- OSOBA -->

    <div class="person-row">

        <div class="person-avatar">

            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="4.5" r="2.4"/>
                <path d="M8 9c0-1.6 1.4-2.7 4-2.7S16 7.4 16 9v4.8h-1.6V21h-2v-7.2h-.8V21h-2v-7.2H8z"/>
            </svg>

        </div>

        <div>

            <h2 class="person-name">
                Roman
            </h2>

            <div class="person-meta">
                59 lat · 189 cm
            </div>

        </div>

    </div>


    <!-- MAKRO -->

    <div class="profile-macros">

        <div class="macro-item">

            <div class="macro-icon macro-kcal">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3c-3 4-5 6.5-5 10a5 5 0 0 0 10 0c0-3.5-2-6-5-10z"/>
                </svg>
            </div>

            <span class="macro-value">2183</span>
            <span class="macro-label">kcal</span>

        </div>


        <div class="macro-item">

            <div class="macro-icon macro-protein">
                <svg viewBox="0 0 24 24">
                    <path d="M7 8c-2 1-3 3-3 6 0 4 2 7 5 7 1.3 0 2.3-.5 3-1.2.7.7 1.7 1.2 3 1.2 3 0 5-3 5-7 0-3-1-5-3-6"/>
                </svg>
            </div>

            <span class="macro-value">136 g</span>
            <span class="macro-label">białko</span>

        </div>


        <div class="macro-item">

            <div class="macro-icon macro-fat">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3C9 7 6 10 6 14a6 6 0 0 0 12 0c0-4-3-7-6-11z"/>
                </svg>
            </div>

            <span class="macro-value">73 g</span>
            <span class="macro-label">tłuszcz</span>

        </div>


        <div class="macro-item">

            <div class="macro-icon macro-carbs">
                <svg viewBox="0 0 24 24">
                    <path d="M4 4c8 0 14 4 16 14-8 1-15-4-16-14z"/>
                    <path d="M7 8c4 4 7 7 12 10"/>
                </svg>
            </div>

            <span class="macro-value">246 g</span>
            <span class="macro-label">węgle</span>

        </div>

    </div>


    <!-- CEL -->

    <div class="profile-goal">

        <span class="goal-check">
            ✓
        </span>

        <span>
            Próg białka: 35 g · błonnik: 31 g · redukcja
        </span>

    </div>


    <!-- PRZYCISKI -->

    <div class="profile-actions">

        <button class="profile-button profile-button--primary">

            <svg viewBox="0 0 24 24">
                <path d="M4 20h4l11-11-4-4L4 16v4z"/>
                <path d="M14 6l4 4"/>
            </svg>

            Edytuj profil

        </button>


        <button class="profile-button profile-button--outline">

            <svg viewBox="0 0 24 24">
                <path d="M4 6h16"/>
                <path d="M9 6V4h6v2"/>
                <path d="M7 6l1 14h8l1-14"/>
            </svg>

            Usuń profil

        </button>


        <button class="profile-button profile-button--primary">

            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 8v8M8 12h8"/>
            </svg>

            Dodaj profil

        </button>

    </div>

</section>

</div>

</body>
</html>
